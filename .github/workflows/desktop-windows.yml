name: Windows desktop release
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop-windows.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - name: Install shared dependencies
        run: pnpm install --frozen-lockfile
      - name: Install desktop dependencies
        run: npm ci --prefix desktop
      - name: Type check
        run: pnpm check
      - name: Build desktop and test local data flow
        run: |
          npm --prefix desktop run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix desktop test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows installer
        run: npm --prefix desktop run package:win
      - name: Verify packaged and installed app
        shell: pwsh
        run: |
          $dataDir = Join-Path $env:RUNNER_TEMP 'zhixu-smoke-data'
          function Test-Desktop($exe) {
            Remove-Item (Join-Path $dataDir 'smoke-result.json') -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test', "--smoke-dir=$dataDir" -PassThru
            if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'Desktop launch timed out' }
            if ($p.ExitCode -ne 0) { Get-Content (Join-Path $dataDir 'smoke-error.txt') -ErrorAction SilentlyContinue; throw 'Desktop launch failed' }
            $result = Get-Content (Join-Path $dataDir 'smoke-result.json') | ConvertFrom-Json
            if (-not $result.ok -or -not $result.nodeIntegration) { throw 'Desktop smoke check failed' }
            Write-Output ($result | ConvertTo-Json -Compress)
          }
          Test-Desktop (Join-Path $pwd 'desktop/release/win-unpacked/知序.exe')
          $installDir = Join-Path $env:RUNNER_TEMP 'zhixu-installed'
          $installer = Join-Path $pwd 'desktop/release/Zhixu-Setup-0.2.0-x64.exe'
          $p = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Installer failed' }
          Test-Desktop (Join-Path $installDir '知序.exe')
      - name: Generate checksum
        shell: pwsh
        run: |
          $file = 'desktop/release/Zhixu-Setup-0.2.0-x64.exe'
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  Zhixu-Setup-0.2.0-x64.exe" | Set-Content 'desktop/release/SHA256SUMS.txt' -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: zhixu-windows-x64
          path: |
            desktop/release/Zhixu-Setup-0.2.0-x64.exe
            desktop/release/SHA256SUMS.txt
      - name: Publish verified installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create v0.2.0-desktop-preview --target $env:GITHUB_SHA --prerelease --draft --title '知序 v0.2.0 · Windows 桌面预览版' --notes-file desktop/RELEASE.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload v0.2.0-desktop-preview desktop/release/Zhixu-Setup-0.2.0-x64.exe desktop/release/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit v0.2.0-desktop-preview --draft=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
