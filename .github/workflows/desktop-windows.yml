name: Windows desktop release
on:
  push:
    branches: [main]
    paths: ['desktop/**', 'app/**', 'components/**', 'lib/**', 'drizzle/**', 'tests/ui-fluent.mjs', 'package.json', 'pnpm-lock.yaml', '.github/workflows/desktop-windows.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - name: Read release version
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          "DESKTOP_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version-desktop-preview" >> $env:GITHUB_ENV
          "INSTALLER=Zhixu-Setup-$version-x64.exe" >> $env:GITHUB_ENV
          "PORTABLE=Zhixu-$version-win-x64.zip" >> $env:GITHUB_ENV
      - name: Install shared dependencies
        run: pnpm install --frozen-lockfile
      - name: Install desktop dependencies
        run: npm ci --prefix desktop
      - name: Type check
        run: pnpm check
      - name: Build desktop and test local data flow
        run: |
          npm --prefix desktop run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix desktop test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify real UI, long content and display scales
        run: |
          pnpm exec playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test:ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fluent-ui-screenshots
          path: outputs/fluent/*.png
          if-no-files-found: ignore
      - name: Build Windows installer
        run: npm --prefix desktop run package:win
      - name: Verify packaged and installed app
        shell: pwsh
        run: |
          $dataDir = Join-Path $env:RUNNER_TEMP 'zhixu-smoke-data'
          function Test-Desktop($exe) {
            Remove-Item (Join-Path $dataDir 'smoke-result.json') -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test', "--smoke-dir=$dataDir" -PassThru
            if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'Desktop launch timed out' }
            if ($p.ExitCode -ne 0) { Get-Content (Join-Path $dataDir 'smoke-error.txt') -ErrorAction SilentlyContinue; throw 'Desktop launch failed' }
            $result = Get-Content (Join-Path $dataDir 'smoke-result.json') | ConvertFrom-Json
            if (-not $result.ok -or -not $result.nodeIntegration) { throw 'Desktop smoke check failed' }
            Write-Output ($result | ConvertTo-Json -Compress)
          }
          Test-Desktop (Join-Path $pwd 'desktop/release/win-unpacked/知序.exe')
          $installDir = Join-Path $env:RUNNER_TEMP 'zhixu-installed'
          $installer = Join-Path $pwd "desktop/release/$env:INSTALLER"
          $p = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Installer failed' }
          Test-Desktop (Join-Path $installDir '知序.exe')
      - name: Package complete app folder and checksums
        shell: pwsh
        run: |
          Compress-Archive -Path 'desktop/release/win-unpacked/*' -DestinationPath "desktop/release/$env:PORTABLE"
          $lines = @($env:INSTALLER, $env:PORTABLE) | ForEach-Object {
            $hash = (Get-FileHash "desktop/release/$_" -Algorithm SHA256).Hash.ToLower()
            "$hash  $_"
          }
          $lines | Set-Content 'desktop/release/SHA256SUMS.txt' -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: zhixu-windows-x64
          path: |
            desktop/release/Zhixu-Setup-*.exe
            desktop/release/Zhixu-*-win-x64.zip
            desktop/release/SHA256SUMS.txt
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read release version
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          "DESKTOP_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version-desktop-preview" >> $env:GITHUB_ENV
          "INSTALLER=Zhixu-Setup-$version-x64.exe" >> $env:GITHUB_ENV
          "PORTABLE=Zhixu-$version-win-x64.zip" >> $env:GITHUB_ENV
      - uses: actions/download-artifact@v4
        with:
          name: zhixu-windows-x64
          path: desktop/release
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $existing = gh release view $env:RELEASE_TAG --json isDraft,targetCommitish 2>$null | ConvertFrom-Json
          if ($LASTEXITCODE -eq 0) {
            if (-not $existing.isDraft) {
              Write-Output 'This version is already published; leave its verified packages unchanged. Bump desktop/package.json to publish another version.'
              exit 0
            }
            if ($existing.targetCommitish -ne $env:GITHUB_SHA) { throw 'Existing draft belongs to a different commit. Use a new version.' }
          } else {
            gh release create $env:RELEASE_TAG --target $env:GITHUB_SHA --prerelease --draft --title "知序 v$env:DESKTOP_VERSION · Fluent 桌面预览版" --notes-file desktop/RELEASE.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $env:RELEASE_TAG "desktop/release/$env:INSTALLER" "desktop/release/$env:PORTABLE" desktop/release/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $env:RELEASE_TAG --draft=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
